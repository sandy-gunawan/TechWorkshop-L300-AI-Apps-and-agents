<!DOCTYPE html>
<html>
<head><title>Diagram Test</title>
<style>
.a2a-diagram { position:relative; height:220px; background:#1e1b4b; padding:0; overflow:hidden; isolation:isolate; width:400px; }
.a2a-node { display:flex; flex-direction:row; align-items:center; z-index:2; position:absolute; }
.a2a-icon { width:36px; height:36px; border-radius:50%; background:#312e81; border:2px solid #10b981; display:flex; align-items:center; justify-content:center; font-size:1rem; }
.a2a-lbl { color:#c4b5fd; font-size:0.6rem; margin-left:4px; white-space:nowrap; }
</style>
</head>
<body style="background:#000;padding:20px;">
<h3 style="color:#fff;">Diagram Line Test</h3>
<div id="a2a-diagram" class="a2a-diagram">
    <svg id="a2a-lines" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;"></svg>
    <div class="a2a-node" id="a2a-user" style="left:3%;top:20%;"><div class="a2a-icon">👤</div><div class="a2a-lbl">User</div></div>
    <div class="a2a-node" id="a2a-client" style="left:26%;top:20%;"><div class="a2a-icon">📡</div><div class="a2a-lbl">Client</div></div>
    <div class="a2a-node" id="a2a-server" style="left:49%;top:20%;"><div class="a2a-icon">🌐</div><div class="a2a-lbl">Server</div></div>
    <div class="a2a-node" id="a2a-manager" style="left:26%;top:65%;"><div class="a2a-icon">🧠</div><div class="a2a-lbl">Manager</div></div>
    <div class="a2a-node" id="a2a-product" style="right:5%;top:50%;"><div class="a2a-icon">📦</div><div class="a2a-lbl">Product</div></div>
    <div class="a2a-node" id="a2a-marketing" style="right:5%;top:72%;"><div class="a2a-icon">📣</div><div class="a2a-lbl">Marketing</div></div>
    <div class="a2a-node" id="a2a-ranker" style="right:5%;top:94%;"><div class="a2a-icon">🏆</div><div class="a2a-lbl">Ranker</div></div>
</div>
<pre id="log" style="color:#0f0;font-size:12px;margin-top:10px;"></pre>
<script>
var connections = [
    ['a2a-user','a2a-client'],['a2a-client','a2a-server'],
    ['a2a-server','a2a-manager'],['a2a-manager','a2a-product'],
    ['a2a-manager','a2a-marketing'],['a2a-manager','a2a-ranker']
];
function draw() {
    var svg = document.getElementById('a2a-lines');
    var container = document.getElementById('a2a-diagram');
    var cRect = container.getBoundingClientRect();
    svg.setAttribute('width', cRect.width);
    svg.setAttribute('height', cRect.height);
    svg.innerHTML = '';
    var log = '';
    log += 'Container: ' + JSON.stringify({l:cRect.left,t:cRect.top,w:cRect.width,h:cRect.height}) + '\n';
    connections.forEach(function(pair) {
        var a = document.getElementById(pair[0]);
        var b = document.getElementById(pair[1]);
        var ai = a.querySelector('.a2a-icon') || a;
        var bi = b.querySelector('.a2a-icon') || b;
        var ar = ai.getBoundingClientRect();
        var br = bi.getBoundingClientRect();
        var x1 = ar.left + ar.width/2 - cRect.left;
        var y1 = ar.top + ar.height/2 - cRect.top;
        var x2 = br.left + br.width/2 - cRect.left;
        var y2 = br.top + br.height/2 - cRect.top;
        log += pair[0] + ' -> ' + pair[1] + ': (' + x1.toFixed(0) + ',' + y1.toFixed(0) + ') -> (' + x2.toFixed(0) + ',' + y2.toFixed(0) + ')\n';
        var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1); line.setAttribute('y1', y1);
        line.setAttribute('x2', x2); line.setAttribute('y2', y2);
        line.setAttribute('stroke', '#22d3ee');
        line.setAttribute('stroke-width', '2');
        line.setAttribute('stroke-opacity', '1');
        svg.appendChild(line);
    });
    document.getElementById('log').textContent = log;
}
setTimeout(draw, 500);
</script>
</body>
</html>
